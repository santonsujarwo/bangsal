# This repository hosts the Astro starter in /starter.
# root_dir makes Sveltia paths relative to that directory.
backend:
  name: github
  repo: santonsujarwo/bangsal
  branch: main
  root_dir: starter

media_folder: /public/uploads
public_folder: /uploads

publish_mode: preview

collections:
  - name: site_settings
    label: Site Settings
    files:
      - name: general
        label: General
        file: src/data/site.json
        format: json
        fields:
          - { label: Site Name, name: site_name, widget: string }
          - { label: Tagline, name: tagline, widget: string, required: false }
          - { label: Default Description, name: default_description, widget: text, required: false }
          - { label: Default Open Graph Image, name: default_og_image, widget: image, required: false }
          - { label: Language, name: language, widget: string, default: en }
          - { label: Phone, name: phone, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - { label: Address, name: address, widget: text, required: false }
          - { label: Logo, name: logo, widget: image, required: false }
          - label: Social Links
            name: social_links
            widget: list
            required: false
            fields:
              - { label: Platform, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - { label: Footer Note, name: footer_note, widget: string, required: false }
      - name: navigation
        label: Main Navigation
        file: src/data/navigation.json
        format: json
        fields:
          - label: Navigation Items
            name: items
            widget: list
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
              - { label: External Link, name: external, widget: boolean, required: false, default: false }

  - name: pages
    publish_mode:
      type: editorial_workflow
      stages: [draft]
    label: Pages
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: '/{{slug}}/'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - label: Template
        name: template
        widget: select
        options: [default, landing]
        default: default
      - label: Sections
        name: sections
        widget: list
        required: false
        fields:
          - label: Section Type
            name: type
            widget: select
            options: [hero, rich_text, image_text, feature_grid, cta, faq]
          - { label: Eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Heading, name: heading, widget: string, required: false }
          - { label: Body, name: body, widget: text, required: false }
          - { label: Image, name: image, widget: image, required: false }
          - { label: Image Alt, name: image_alt, widget: string, required: false }
          - { label: Button Label, name: button_label, widget: string, required: false }
          - { label: Button URL, name: button_url, widget: string, required: false }
          - label: Items
            name: items
            widget: list
            required: false
            fields:
              - { label: Item Title, name: title, widget: string }
              - { label: Item Description, name: body, widget: text, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: Canonical URL, name: canonical_url, widget: string, required: false }
      - { label: Open Graph Image, name: og_image, widget: image, required: false }
      - { label: No Index, name: noindex, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: services
    publish_mode:
      type: editorial_workflow
      stages: [draft]
    label: Services
    folder: src/content/services
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: '/services/{{slug}}/'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Featured Image, name: featured_image, widget: image, required: false }
      - { label: Featured Image Alt, name: featured_image_alt, widget: string, required: false }
      - { label: Sort Order, name: sort_order, widget: number, default: 0, value_type: int }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: Canonical URL, name: canonical_url, widget: string, required: false }
      - { label: Open Graph Image, name: og_image, widget: image, required: false }
      - { label: No Index, name: noindex, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: posts
    publish_mode:
      type: editorial_workflow
      stages: [draft]
    label: Blog Posts
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    preview_path: '/blog/{{slug}}/'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Excerpt, name: excerpt, widget: text, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Publish Date, name: published_at, widget: datetime, required: false }
      - { label: Updated Date, name: updated_at, widget: datetime, required: false }
      - { label: Featured Image, name: featured_image, widget: image, required: false }
      - { label: Featured Image Alt, name: featured_image_alt, widget: string, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: Canonical URL, name: canonical_url, widget: string, required: false }
      - { label: Open Graph Image, name: og_image, widget: image, required: false }
      - { label: No Index, name: noindex, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

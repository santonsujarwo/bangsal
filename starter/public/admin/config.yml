# Update repo, branch, site URL, and GitHub authentication before using CMS.
backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/YOUR_REPOSITORY
  branch: main

media_folder: public/uploads
public_folder: /uploads
site_url: https://example.com
display_url: https://example.com

collections:
  - name: pages
    label: Pages
    folder: src/content/pages
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: No Index, name: noindex, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: services
    label: Services
    folder: src/content/services
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Featured Image, name: featured_image, widget: image, required: false }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  - name: posts
    label: Blog Posts
    folder: src/content/posts
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Excerpt, name: excerpt, widget: text, required: false }
      - { label: Author, name: author, widget: string, required: false }
      - { label: Publish Date, name: published_at, widget: datetime, required: false }
      - { label: Featured Image, name: featured_image, widget: image, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Tags, name: tags, widget: list, required: false }
      - { label: Draft, name: draft, widget: boolean, default: true }
      - { label: SEO Title, name: seo_title, widget: string, required: false }
      - { label: SEO Description, name: seo_description, widget: text, required: false }
      - { label: Body, name: body, widget: markdown }

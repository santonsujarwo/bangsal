name: Astro CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    working-directory: starter

jobs:
  validate:
    name: Type check, production build and generated-site QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro type and content checks
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Test CMS editor content modes and rendered output
        run: npm run test:cms

      - name: Verify generated routes and media
        run: npm run qa:build
